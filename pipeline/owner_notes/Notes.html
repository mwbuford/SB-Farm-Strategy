<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        font-family: Georgia, 'Times New Roman', serif;
        background: linear-gradient(165deg, #e8f0e8 0%, #f4f1ea 45%, #ebe4d6 100%);
        color: #1a3d2b;
        min-height: 100vh;
      }
      .wrap { max-width: 640px; margin: 0 auto; }
      header { margin-bottom: 14px; }
      header h1 {
        font-size: 1.55rem;
        margin: 0 0 4px;
        letter-spacing: 0.02em;
      }
      header p { margin: 0; color: #5a6b5e; font-size: 0.92rem; font-family: system-ui, sans-serif; }
      .tabs {
        display: flex;
        gap: 6px;
        margin: 16px 0 12px;
        font-family: system-ui, sans-serif;
      }
      .tab {
        flex: 1;
        border: 1px solid #9aab9e;
        background: rgba(255,255,255,0.55);
        color: #3d4f42;
        padding: 10px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .tab.active {
        background: #2d5a3d;
        border-color: #2d5a3d;
        color: #fff;
      }
      .panel {
        background: rgba(255,255,255,0.88);
        border: 1px solid #c5d4c8;
        border-radius: 12px;
        padding: 18px;
        box-shadow: 0 8px 28px rgba(26, 61, 43, 0.08);
      }
      .hidden { display: none; }
      label {
        display: block;
        font-family: system-ui, sans-serif;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #5a6b5e;
        margin: 12px 0 6px;
      }
      label:first-child { margin-top: 0; }
      input[type='text'], input[type='date'], select, textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #c5d4c8;
        border-radius: 8px;
        font-size: 1rem;
        font-family: system-ui, sans-serif;
        background: #fff;
        color: #1a3d2b;
      }
      textarea {
        min-height: 160px;
        resize: vertical;
        line-height: 1.45;
        font-family: Georgia, serif;
        font-size: 1.02rem;
      }
      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      @media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }
      .hint {
        font-family: system-ui, sans-serif;
        font-size: 0.8rem;
        color: #6b7c70;
        margin: 4px 0 0;
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
      }
      input[type='file'] {
        width: 100%;
        font-family: system-ui, sans-serif;
        font-size: 0.9rem;
      }
      .preview {
        margin-top: 8px;
        max-width: 100%;
        max-height: 180px;
        border-radius: 8px;
        display: none;
        border: 1px solid #c5d4c8;
      }
      button.primary {
        width: 100%;
        margin-top: 18px;
        border: 0;
        border-radius: 8px;
        padding: 14px 16px;
        font-size: 1rem;
        font-weight: 700;
        font-family: system-ui, sans-serif;
        background: #2d5a3d;
        color: #fff;
        cursor: pointer;
      }
      button.primary:disabled { opacity: 0.55; cursor: wait; }
      button.ghost {
        border: 1px solid #9aab9e;
        background: #fff;
        color: #2d5a3d;
        border-radius: 8px;
        padding: 8px 12px;
        font-family: system-ui, sans-serif;
        font-weight: 600;
        cursor: pointer;
      }
      #status {
        display: none;
        margin-top: 14px;
        padding: 12px;
        border-radius: 8px;
        font-family: system-ui, sans-serif;
        font-size: 0.92rem;
        line-height: 1.45;
      }
      .ok { background: #ecfdf3; color: #166534; }
      .err { background: #fef2f2; color: #991b1b; }
      .loading { background: #eff6ff; color: #1d4ed8; }
      .search-row {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        font-family: system-ui, sans-serif;
      }
      .search-row input { flex: 1; }
      .note-card {
        border-top: 1px solid #dce6df;
        padding: 12px 0;
        font-family: system-ui, sans-serif;
      }
      .note-card:first-of-type { border-top: 0; padding-top: 0; }
      .note-card h3 {
        margin: 0 0 4px;
        font-size: 1rem;
        font-family: Georgia, serif;
        color: #1a3d2b;
      }
      .meta { font-size: 0.8rem; color: #6b7c70; margin-bottom: 6px; }
      .summary { font-size: 0.92rem; line-height: 1.45; color: #2a4032; }
      .links { margin-top: 8px; font-size: 0.85rem; }
      .links a { color: #2d5a3d; margin-right: 12px; }
      .doc-link {
        font-family: system-ui, sans-serif;
        font-size: 0.85rem;
        margin-bottom: 10px;
      }
      .doc-link a { color: #2d5a3d; }
      .empty { color: #6b7c70; font-family: system-ui, sans-serif; font-size: 0.92rem; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Owner Notes</h1>
        <p>Capture meeting notes, photos of paper notes, and pull up summaries anytime.</p>
      </header>

      <div class="tabs">
        <button type="button" class="tab active" id="tabNew" data-panel="panelNew">New note</button>
        <button type="button" class="tab" id="tabBrowse" data-panel="panelBrowse">Summaries</button>
      </div>

      <div class="panel" id="panelNew">
        <div class="doc-link" id="docLinkNew"></div>

        <div class="row2">
          <div>
            <label for="noteDate">Date</label>
            <input type="date" id="noteDate" />
          </div>
          <div>
            <label for="category">Category</label>
            <select id="category"></select>
          </div>
        </div>

        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. Weekly check-in with Index Fresh agronomist" />

        <label for="withWhom">With whom</label>
        <input type="text" id="withWhom" placeholder="Consultant, agronomist, advisor…" />

        <label for="noteBody">Raw notes</label>
        <textarea id="noteBody" placeholder="Type freely — rough notes are fine. Everything is saved to your Owner Notes doc."></textarea>

        <label for="photo">Photo of paper notes <span class="hint">(optional)</span></label>
        <input type="file" id="photo" accept="image/*" />
        <p class="hint">JPG or PNG. We’ll OCR the photo and add the image + text into the Google Doc.</p>
        <img id="preview" class="preview" alt="Photo preview" />

        <label for="author">Logged by</label>
        <input type="text" id="author" value="Sarah" />

        <button type="button" class="primary" id="submit">Save to Owner Notes</button>
        <div id="status"></div>
      </div>

      <div class="panel hidden" id="panelBrowse">
        <div class="doc-link" id="docLinkBrowse"></div>
        <div class="search-row">
          <input type="text" id="search" placeholder="Search summaries, people, titles…" />
          <button type="button" class="ghost" id="refresh">Search</button>
        </div>
        <div id="notesList" class="empty">Loading…</div>
      </div>
    </div>

    <script>
      const noteDate = document.getElementById('noteDate');
      const category = document.getElementById('category');
      const title = document.getElementById('title');
      const withWhom = document.getElementById('withWhom');
      const noteBody = document.getElementById('noteBody');
      const photo = document.getElementById('photo');
      const preview = document.getElementById('preview');
      const author = document.getElementById('author');
      const submitBtn = document.getElementById('submit');
      const statusEl = document.getElementById('status');
      const notesList = document.getElementById('notesList');
      const search = document.getElementById('search');

      let selectedFile = null;

      function setStatus(kind, html) {
        statusEl.className = kind;
        statusEl.innerHTML = html;
        statusEl.style.display = 'block';
      }

      function esc(s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function showPanel(id) {
        document.getElementById('panelNew').classList.toggle('hidden', id !== 'panelNew');
        document.getElementById('panelBrowse').classList.toggle('hidden', id !== 'panelBrowse');
        document.querySelectorAll('.tab').forEach(function (t) {
          t.classList.toggle('active', t.getAttribute('data-panel') === id);
        });
        if (id === 'panelBrowse') loadNotes();
      }

      document.querySelectorAll('.tab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          showPanel(btn.getAttribute('data-panel'));
        });
      });

      function setDocLinks(url) {
        const html = url
          ? 'Full chronological doc: <a href="' + esc(url) + '" target="_blank" rel="noopener">Open Owner Notes Google Doc</a>'
          : '';
        document.getElementById('docLinkNew').innerHTML = html;
        document.getElementById('docLinkBrowse').innerHTML = html;
      }

      function readFileAsDataUrl(file) {
        return new Promise(function (resolve, reject) {
          if (!file) return resolve(null);
          const reader = new FileReader();
          reader.onload = function (e) { resolve(e.target.result); };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      photo.addEventListener('change', function () {
        selectedFile = photo.files && photo.files[0] ? photo.files[0] : null;
        if (selectedFile) {
          preview.src = URL.createObjectURL(selectedFile);
          preview.style.display = 'block';
        } else {
          preview.removeAttribute('src');
          preview.style.display = 'none';
        }
      });

      submitBtn.addEventListener('click', function () {
        if (!noteBody.value.trim() && !selectedFile) {
          setStatus('err', 'Add typed notes and/or a photo of your paper notes.');
          return;
        }
        submitBtn.disabled = true;
        setStatus('loading', selectedFile ? 'Saving note + OCR’ing photo…' : 'Saving note to Google Doc…');

        readFileAsDataUrl(selectedFile)
          .then(function (dataUrl) {
            const payload = {
              noteDate: noteDate.value,
              title: title.value,
              withWhom: withWhom.value,
              category: category.value,
              noteBody: noteBody.value,
              author: author.value,
              photoBase64: dataUrl,
              photoMime: selectedFile ? selectedFile.type : '',
              photoName: selectedFile ? selectedFile.name : '',
            };
            return new Promise(function (resolve, reject) {
              google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject)
                .submitOwnerNote(payload);
            });
          })
          .then(function (res) {
            let msg = '<strong>Saved.</strong> Summary:<br>' + esc(res.summary);
            if (res.bookmarkUrl) {
              msg += '<br><br><a href="' + esc(res.bookmarkUrl) + '" target="_blank" rel="noopener">Open this note in the Doc</a>';
            } else if (res.docUrl) {
              msg += '<br><br><a href="' + esc(res.docUrl) + '" target="_blank" rel="noopener">Open Owner Notes Doc</a>';
            }
            if (res.hasOcr) msg += '<br>Photo text was OCR’d and added to the doc.';
            setStatus('ok', msg);
            noteBody.value = '';
            title.value = '';
            withWhom.value = '';
            photo.value = '';
            selectedFile = null;
            preview.style.display = 'none';
            submitBtn.disabled = false;
          })
          .catch(function (err) {
            setStatus('err', esc(err && err.message ? err.message : err));
            submitBtn.disabled = false;
          });
      });

      function renderNotes(data) {
        setDocLinks(data.docUrl);
        const notes = data.notes || [];
        if (!notes.length) {
          notesList.className = 'empty';
          notesList.textContent = 'No notes yet — save your first one from the New note tab.';
          return;
        }
        notesList.className = '';
        notesList.innerHTML = notes
          .map(function (n) {
            const meta = [n.noteDate, n.withWhom, n.category].filter(Boolean).join(' · ');
            let links = '';
            if (n.bookmarkUrl) links += '<a href="' + esc(n.bookmarkUrl) + '" target="_blank" rel="noopener">Open in Doc</a>';
            if (n.photoUrl) links += '<a href="' + esc(n.photoUrl) + '" target="_blank" rel="noopener">Photo</a>';
            return (
              '<div class="note-card">' +
              '<h3>' + esc(n.title) + '</h3>' +
              '<div class="meta">' + esc(meta) + (n.loggedAt ? ' · logged ' + esc(n.loggedAt) : '') + '</div>' +
              '<div class="summary">' + esc(n.summary) + '</div>' +
              (links ? '<div class="links">' + links + '</div>' : '') +
              '</div>'
            );
          })
          .join('');
      }

      function loadNotes() {
        notesList.className = 'empty';
        notesList.textContent = 'Loading…';
        google.script.run
          .withSuccessHandler(renderNotes)
          .withFailureHandler(function (err) {
            notesList.className = 'empty';
            notesList.textContent = err && err.message ? err.message : String(err);
          })
          .listOwnerNotes(search.value, 100);
      }

      document.getElementById('refresh').addEventListener('click', loadNotes);
      search.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') loadNotes();
      });

      google.script.run
        .withSuccessHandler(function (meta) {
          (meta.categories || []).forEach(function (c) {
            const opt = document.createElement('option');
            opt.value = c;
            opt.textContent = c;
            category.appendChild(opt);
          });
          if (meta.today) noteDate.value = meta.today;
          setDocLinks(meta.docUrl);
        })
        .withFailureHandler(function (err) {
          setStatus('err', 'Could not load form: ' + esc(err && err.message ? err.message : err));
        })
        .getFormMeta();
    </script>
  </body>
</html>
