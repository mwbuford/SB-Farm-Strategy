<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        padding: 16px;
        background: #f3f1eb;
        color: #1f2937;
      }
      .card {
        max-width: 640px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }
      h1 { font-size: 1.2rem; margin: 0 0 6px; }
      p.sub { margin: 0 0 16px; color: #4b5563; font-size: 0.9rem; line-height: 1.45; }
      label { display: block; font-weight: 600; font-size: 0.85rem; margin: 10px 0 6px; }
      input[type='text'], input[type='date'], input[type='number'], textarea, select {
        width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem;
      }
      textarea { min-height: 120px; resize: vertical; font-size: 0.85rem; font-family: ui-monospace, monospace; }
      input[type='file'] { width: 100%; margin-top: 4px; }
      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
      button {
        width: 100%; border: 0; border-radius: 8px; padding: 14px 16px; margin-top: 18px;
        font-size: 1rem; font-weight: 600; background: #1f4d36; color: #fff; cursor: pointer;
      }
      button#reparse { width: auto; padding: 8px 14px; font-size: 0.85rem; margin-top: 10px; background: #4b5563; }
      button:disabled { opacity: 0.6; cursor: wait; }
      #status { margin-top: 14px; padding: 12px; border-radius: 8px; display: none; font-size: 0.92rem; line-height: 1.5; }
      .ok { background: #ecfdf3; color: #166534; }
      .err { background: #fef2f2; color: #991b1b; }
      .loading { background: #eff6ff; color: #1d4ed8; }
      .hint { font-weight: 400; color: #6b7280; font-size: 0.8rem; }
      .section { margin-top: 14px; padding-top: 12px; border-top: 1px solid #e5e7eb; }
      .stmt-card {
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 14px;
        margin-top: 12px;
        background: #fafafa;
      }
      .stmt-card h3 { margin: 0 0 10px; font-size: 0.95rem; color: #374151; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Grower Statement Upload</h1>
      <p class="sub">
        Upload an Index Fresh grower statement PDF (or page photos). OCR extracts one card per block/page —
        review pool week, bins, net $, and field receipts, then save to the sheet.
      </p>

      <label for="file">Statement PDF or photo</label>
      <input id="file" type="file" accept="application/pdf,image/*" />
      <p class="hint">PDF preferred (multi-page OK). JPG/PNG of individual pages also work.</p>

      <div class="section">
        <label for="rawText">Full detected text (pre-parse)</label>
        <textarea id="rawText" placeholder="OCR text will appear here — or paste from Adobe/Preview copy…"></textarea>
        <button type="button" id="reparse">Re-parse from text</button>
      </div>

      <div class="section">
        <label>Parsed statements (review/edit before save)</label>
        <div id="statementCards"></div>
      </div>

      <button id="submit" disabled>Save to sheet</button>
      <div id="status"></div>
    </div>

    <script>
      const fileInput = document.getElementById('file');
      const submitBtn = document.getElementById('submit');
      const reparseBtn = document.getElementById('reparse');
      const statusEl = document.getElementById('status');
      const cardsEl = document.getElementById('statementCards');
      let selectedFile = null;
      let statementCount = 0;

      function setStatus(kind, html) {
        statusEl.className = kind;
        statusEl.innerHTML = html;
        statusEl.style.display = 'block';
      }

      function readFileAsDataUrl_(file) {
        return new Promise(function (resolve, reject) {
          if (!file) return resolve(null);
          const reader = new FileReader();
          reader.onload = function (e) { resolve(e.target.result); };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function esc_(s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function moneyVal_(v) {
        return v != null && v !== '' ? v : '';
      }

      let knownBlocks = [];

      function blockSelectHtml_(selected, idx) {
        let html =
          '<select data-field="block_parcel" data-idx="' +
          idx +
          '"><option value="">— select block —</option>';
        for (let b = 0; b < knownBlocks.length; b++) {
          const name = knownBlocks[b];
          const sel = selected && selected === name ? ' selected' : '';
          html += '<option value="' + esc_(name) + '"' + sel + '>' + esc_(name) + '</option>';
        }
        // If OCR returned something not in the list, show it so Sarah can see / clear it
        if (selected && knownBlocks.indexOf(selected) === -1) {
          html +=
            '<option value="" selected disabled>Unrecognized: ' +
            esc_(selected) +
            ' (pick from list)</option>';
        }
        html += '</select>';
        return html;
      }

      function renderStatementCards(statements) {
        cardsEl.innerHTML = '';
        statementCount = statements.length || 0;
        if (!statementCount) {
          cardsEl.innerHTML = '<p class="hint">No parsed statements yet.</p>';
          return;
        }

        for (let i = 0; i < statements.length; i++) {
          const s = statements[i] || {};
          const card = document.createElement('div');
          card.className = 'stmt-card';
          const blockVal = s.block_parcel || '';
          const needsBlock = !blockVal || knownBlocks.indexOf(blockVal) === -1;
          card.innerHTML =
            '<h3>Statement ' + (i + 1) +
              (blockVal && knownBlocks.indexOf(blockVal) >= 0 ? ' — ' + esc_(blockVal) : '') +
              (s.pool_number != null ? ' · Pool ' + s.pool_number : '') +
            '</h3>' +
            (needsBlock
              ? '<p class="hint" style="color:#991b1b;margin:0 0 8px">No ranch name found in the OCR text yet — pick from the list (GR… is the grower #, not the block).</p>'
              : '') +
            '<div class="row2">' +
              '<div><label>Block</label>' + blockSelectHtml_(blockVal, i) + '</div>' +
              '<div><label>Pool #</label><input type="number" data-field="pool_number" data-idx="' + i + '" value="' + moneyVal_(s.pool_number) + '"></div>' +
            '</div>' +
            '<div class="row2">' +
              '<div><label>Period start</label><input type="date" data-field="period_start" data-idx="' + i + '" value="' + esc_(s.period_start || '') + '"></div>' +
              '<div><label>Period end</label><input type="date" data-field="period_end" data-idx="' + i + '" value="' + esc_(s.period_end || '') + '"></div>' +
            '</div>' +
            '<div class="row2">' +
              '<div><label>Variety</label><input type="text" data-field="variety" data-idx="' + i + '" value="' + esc_(s.variety || 'Hass') + '"></div>' +
              '<div><label>Bins received</label><input type="number" step="0.01" data-field="bins_received" data-idx="' + i + '" value="' + moneyVal_(s.bins_received) + '"></div>' +
            '</div>' +
            '<div class="row2">' +
              '<div><label>Index block ID</label><input type="text" data-field="index_block_id" data-idx="' + i + '" value="' + esc_(s.index_block_id || '') + '"></div>' +
              '<div><label>Statement date</label><input type="date" data-field="statement_date" data-idx="' + i + '" value="' + esc_(s.statement_date || '') + '"></div>' +
            '</div>' +
            '<div class="row3">' +
              '<div><label>Lbs #1</label><input type="number" step="0.1" data-field="lbs_grade1" data-idx="' + i + '" value="' + moneyVal_(s.lbs_grade1) + '"></div>' +
              '<div><label>Lbs #2</label><input type="number" step="0.1" data-field="lbs_grade2" data-idx="' + i + '" value="' + moneyVal_(s.lbs_grade2) + '"></div>' +
              '<div><label>Lbs culls</label><input type="number" step="0.1" data-field="lbs_culls" data-idx="' + i + '" value="' + moneyVal_(s.lbs_culls) + '"></div>' +
            '</div>' +
            '<div class="row2">' +
              '<div><label>Lbs total</label><input type="number" step="0.1" data-field="lbs_total" data-idx="' + i + '" value="' + moneyVal_(s.lbs_total) + '"></div>' +
              '<div><label>Avg rate ($/lb)</label><input type="number" step="0.0001" data-field="avg_rate" data-idx="' + i + '" value="' + moneyVal_(s.avg_rate) + '"></div>' +
            '</div>' +
            '<div class="row3">' +
              '<div><label>Gross $</label><input type="number" step="0.01" data-field="gross_amount" data-idx="' + i + '" value="' + moneyVal_(s.gross_amount) + '"></div>' +
              '<div><label>Charges $</label><input type="number" step="0.01" data-field="charges_total" data-idx="' + i + '" value="' + moneyVal_(s.charges_total) + '"></div>' +
              '<div><label>Net $</label><input type="number" step="0.01" data-field="net_amount" data-idx="' + i + '" value="' + moneyVal_(s.net_amount) + '"></div>' +
            '</div>' +
            '<label>Field receipt #s <span class="hint">(space-separated — joins to bin receipts)</span></label>' +
            '<input type="text" data-field="field_receipts_text" data-idx="' + i + '" value="' +
              esc_(s.field_receipts_text || (Array.isArray(s.field_receipts) ? s.field_receipts.join(' ') : '')) +
            '">' +
            '<label>Notes</label><input type="text" data-field="notes" data-idx="' + i + '" value="' + esc_(s.notes || '') + '">';
          cardsEl.appendChild(card);
        }
      }

      function collectStatementsFromUI() {
        const out = [];
        for (let i = 0; i < statementCount; i++) {
          function val(field) {
            const el = document.querySelector('[data-field="' + field + '"][data-idx="' + i + '"]');
            return el ? el.value : '';
          }
          out.push({
            block_parcel: val('block_parcel'),
            pool_number: val('pool_number'),
            period_start: val('period_start'),
            period_end: val('period_end'),
            variety: val('variety'),
            bins_received: val('bins_received'),
            index_block_id: val('index_block_id'),
            statement_date: val('statement_date'),
            lbs_grade1: val('lbs_grade1'),
            lbs_grade2: val('lbs_grade2'),
            lbs_culls: val('lbs_culls'),
            lbs_total: val('lbs_total'),
            avg_rate: val('avg_rate'),
            gross_amount: val('gross_amount'),
            charges_total: val('charges_total'),
            net_amount: val('net_amount'),
            field_receipts_text: val('field_receipts_text'),
            notes: val('notes'),
          });
        }
        return out;
      }

      function applyPreviewResult(res) {
        if (res.warning) setStatus('err', res.warning);
        document.getElementById('rawText').value = res.text || '';
        const statements = res.statements || [];
        renderStatementCards(statements);
        submitBtn.disabled = false;
        if (!res.warning || statements.length) {
          const n = statements.length;
          let msg = 'Found ' + n + ' statement' + (n === 1 ? '' : 's') + '. Review fields, then save.';
          for (let i = 0; i < statements.length; i++) {
            const s = statements[i];
            if (s.net_amount != null && s.bins_received) {
              const perBin = (Number(s.net_amount) / Number(s.bins_received)).toFixed(0);
              msg += '<br>' + (s.block_parcel || 'Block ' + (i + 1)) + ': ~$' + perBin + '/bin net';
            }
          }
          setStatus('ok', msg);
        }
      }

      reparseBtn.addEventListener('click', function () {
        const rawText = document.getElementById('rawText').value.trim();
        if (!rawText) {
          setStatus('err', 'Paste or upload OCR text first.');
          return;
        }
        setStatus('loading', 'Re-parsing text…');
        const fileNameHint = selectedFile ? selectedFile.name : '';
        google.script.run
          .withSuccessHandler(applyPreviewResult)
          .withFailureHandler(function (err) {
            setStatus('err', 'Re-parse failed: ' + (err.message || err));
          })
          .previewStatementFromPastedText(rawText, fileNameHint);
      });

      fileInput.addEventListener('change', function () {
        selectedFile = fileInput.files[0] || null;
        submitBtn.disabled = true;
        document.getElementById('rawText').value = '';
        cardsEl.innerHTML = '';

        if (!selectedFile) return;

        setStatus('loading', 'Extracting text (PDF OCR can take 15–40s)…');
        readFileAsDataUrl_(selectedFile)
          .then(function (dataUrl) {
            const mimeType = selectedFile.type || 'application/pdf';
            google.script.run
              .withSuccessHandler(applyPreviewResult)
              .withFailureHandler(function (err) {
                setStatus('err', 'Extraction failed: ' + (err.message || err) +
                  '<br>Tip: open the PDF, copy text, paste below, then Re-parse.');
                submitBtn.disabled = false;
              })
              .previewOcrFile(dataUrl, mimeType, selectedFile.name);
          })
          .catch(function (e) {
            setStatus('err', String(e.message || e));
            submitBtn.disabled = false;
          });
      });

      submitBtn.addEventListener('click', async function () {
        const rawText = document.getElementById('rawText').value.trim();
        if (!selectedFile && !rawText) {
          setStatus('err', 'Upload a PDF/photo or paste text first.');
          return;
        }

        submitBtn.disabled = true;
        setStatus('loading', 'Saving to sheet…');

        try {
          const dataUrl = await readFileAsDataUrl_(selectedFile);
          const mimeType = selectedFile ? (selectedFile.type || 'application/pdf') : '';
          const statements = collectStatementsFromUI();
          const missingBlock = statements.filter(function (s) {
            return !s.block_parcel || knownBlocks.indexOf(s.block_parcel) === -1;
          });
          if (missingBlock.length) {
            submitBtn.disabled = false;
            setStatus(
              'err',
              '<strong>Pick a ranch block</strong> for each statement (dropdown). ' +
                'Grower numbers like GR1532 are not block names.'
            );
            return;
          }
          const payload = {
            pasted_text: rawText,
            statements_json: JSON.stringify(statements),
            filename: selectedFile ? selectedFile.name : '',
          };

          google.script.run
            .withSuccessHandler(function (result) {
              submitBtn.disabled = false;
              let html = '<strong>Saved ' + (result.statementCount || 1) + ' statement(s).</strong><ul>';
              const summaries = result.summaries || [];
              for (let i = 0; i < summaries.length; i++) {
                const s = summaries[i];
                html += '<li>' + (s.block || '—');
                if (s.pool) html += ' · Pool ' + s.pool;
                if (s.net != null) html += ' · net $' + Number(s.net).toLocaleString();
                if (s.bins != null) html += ' · ' + s.bins + ' bins';
                if (s.receiptCount) html += ' · ' + s.receiptCount + ' field receipts';
                html += '</li>';
              }
              html += '</ul>';
              if (result.warning) html += '<p><strong>Note:</strong> ' + result.warning + '</p>';
              setStatus('ok', html);
            })
            .withFailureHandler(function (err) {
              submitBtn.disabled = false;
              setStatus('err', '<strong>Error:</strong> ' + (err.message || err));
            })
            .processStatementEntry(payload, dataUrl, mimeType);
        } catch (e) {
          submitBtn.disabled = false;
          setStatus('err', String(e.message || e));
        }
      });

      // Load ranch block list for the dropdown
      google.script.run
        .withSuccessHandler(function (blocks) {
          knownBlocks = blocks || [];
        })
        .withFailureHandler(function () {
          knownBlocks = [
            'Ardillas', 'Codornices', 'Colibri', 'Tecolotes', 'Venados', 'Gato Montez',
            'Ranas', 'El Puma', 'Las Abejas', 'Gavilanes', 'Los Osos', 'Caballos', 'La Casa', 'Cuervos',
          ];
        })
        .getKnownBlocks();
    </script>
  </body>
</html>
